<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="IT Shop ร้านโน้ตบุ๊ก สมาร์ตโฟน แท็บเล็ต และอุปกรณ์เสริม" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>IT Shop</title>
    <script>
      // ตั้งโหมดสี (สว่าง/มืด) ก่อนหน้าเว็บโหลด กันจอกระพริบขาวตอนเปิดในโหมดมืด
      (function () {
        try {
          var saved = localStorage.getItem('itshop.theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>ต้องเปิด JavaScript เพื่อใช้งานเว็บนี้</noscript>
    <div id="root"></div>
  </body>
</html>
